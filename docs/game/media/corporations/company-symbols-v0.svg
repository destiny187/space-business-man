    <use href="#space-y" transform="translate(452 160) scale(1.25)" color="#aacde4"/>
    <use href="#iluti" transform="translate(788 150) scale(1.25)" color="#c9ad72"/>
    <use href="#mine" transform="translate(1124 150) scale(1.25)" color="#e89451"/>
    <g text-anchor="middle">
      <text x="216" y="385" font-size="34" font-weight="600" letter-spacing="4">LOTUS</text>
      <text x="552" y="385" font-size="34" font-weight="600" letter-spacing="2">SPACE Y</text>
      <text x="888" y="385" font-size="34" font-weight="600" letter-spacing="3">ILUTI</text>
      <text x="1224" y="385" font-size="38" font-weight="600">mine</text>
      <g font-size="25">
        <text x="216" y="430">개척 · 현장 지원</text>
        <text x="552" y="430">테라포밍 · 행성 운영</text>
        <text x="888" y="430">전투로봇 · 감시</text>
        <text x="1224" y="430">자동 채집 · 산업 장비</text>
      </g>
      <g font-size="23" fill="#a4b5bd">
        <text x="216" y="467">기존 세 꽃잎의 계승</text>
        <text x="552" y="467">상승 궤적과 Y</text>
        <text x="888" y="467">피라미드와 관측의 눈</text>
