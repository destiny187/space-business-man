    <text x="48" y="99" font-size="34" font-weight="600">이전 심볼 비교 · 사용 중단</text>
    <text x="1392" y="96" font-size="23" text-anchor="end" fill="#a4b5bd">CONCEPT v0 · 2026.09.10</text>
