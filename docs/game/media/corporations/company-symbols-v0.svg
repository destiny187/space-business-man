      <path d="M9 139H37L31 151H15ZM66 121H94L88 133H72ZM123 139H151L145 151H129Z" fill="currentColor"/>
    </g>
  </defs>
  <rect width="1440" height="620" rx="8" fill="#10191f"/>
  <g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" fill="#e6e8df">
