<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Lotus, Space Y, Iluti, mine 회사 심볼 초안</title>
  <desc id="desc">Lotus는 세 꽃잎, Space Y는 상승하는 Y, Iluti는 분리된 피라미드와 눈, mine은 두 채굴 아치 모양의 m이다. 게임에 적용하지 않은 벡터 형태 비교 시안이다.</desc>
